name: Markdown Lint & Validation

on:
  push:
    branches: [main, develop]
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'

jobs:
  markdownlint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: '.markdownlint.json'
          globs: |
            **/*.md
            !node_modules
            !.github

  link-check:
    name: Check for broken links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/link-check-config.json'

  skill-structure:
    name: Validate SKILL.md structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SKILL.md has YAML frontmatter
        run: |
          if ! head -1 SKILL.md | grep -q "^---$"; then
            echo "ERROR: SKILL.md must start with YAML frontmatter (---)"
            exit 1
          fi
          echo "✓ YAML frontmatter present"

      - name: Check SKILL.md has required YAML fields
        run: |
          if ! grep -q "^name:" SKILL.md; then
            echo "ERROR: SKILL.md must have 'name' field in YAML"
            exit 1
          fi
          if ! grep -q "^description:" SKILL.md; then
            echo "ERROR: SKILL.md must have 'description' field in YAML"
            exit 1
          fi
          echo "✓ Required YAML fields present"

      - name: Check description length (Claude limit)
        run: |
          DESC=$(awk '/^description:/{flag=1} flag{print} /^---$/ && NR>1{exit}' SKILL.md | sed 's/^description: //' | tr -d '\n')
          LEN=${#DESC}
          if [ $LEN -gt 1024 ]; then
            echo "WARNING: description is $LEN chars, recommended <1024 for reliable triggering"
          else
            echo "✓ description length OK ($LEN chars)"
          fi

      - name: Check no personal data in skill files
        run: |
          # Patterns that suggest personal data leakage
          PATTERNS="ivan vyshnevskiy|vyshnevskiy@gmail|@anthropic\.com"
          if grep -rEi "$PATTERNS" SKILL.md references/ examples/ 2>/dev/null; then
            echo "ERROR: Personal data found in skill files"
            exit 1
          fi
          echo "✓ No personal data in skill files"
